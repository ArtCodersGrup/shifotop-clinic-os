<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShifoTop Clinic OS — Interaktiv prototip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   §7 DIZAYN TOKENLARI — ShifoTop Clinic OS
   ============================================================ */
:root{
  --blue-700:#0B4FA8; --blue-600:#1668E3; --blue-500:#3B86F0;
  --blue-100:#DBEAFE; --blue-50:#EFF6FF;
  --ink-900:#0B1F3A; --ink-700:#2B3F5C; --ink-500:#64748B;
  --ink-300:#CBD5E1; --ink-200:#E2E8F0; --ink-100:#F1F5F9;
  --canvas:#F5F8FC; --surface:#FFFFFF;
  --success:#15803D; --success-bg:#DCFCE7;
  --warning:#B45309; --warning-bg:#FEF3C7;
  --danger:#B91C1C;  --danger-bg:#FEE2E2;
  --info:#0369A1;    --info-bg:#E0F2FE;
  --teal:#0E7490;    --teal-bg:#CFFAFE;

  --doc-1:#1668E3; --doc-2:#7C3AED; --doc-3:#0E7490; --doc-4:#B45309;
  --doc-5:#BE185D; --doc-6:#15803D; --doc-7:#4338CA; --doc-8:#A16207;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --sp-6:24px; --sp-8:32px; --sp-12:48px; --sp-16:64px;

  --r-input:10px; --r-card:14px; --r-modal:18px; --r-chip:999px; --r-tv:28px;

  --e-1:0 1px 2px rgba(11,31,58,.06);
  --e-2:0 4px 12px rgba(11,31,58,.08);
  --e-3:0 24px 48px rgba(11,31,58,.18);

  --ease-standard:cubic-bezier(.2,0,0,1);
  --ease-enter:cubic-bezier(.25,.1,.25,1);
  --ease-overshoot:cubic-bezier(.34,1.56,.64,1);
  --dur-fast:120ms; --dur-base:200ms; --dur-enter:240ms; --dur-exit:160ms;

  --font-ui:'Inter',system-ui,sans-serif;
  --font-display:'Manrope','Inter',sans-serif;
  --font-data:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-ui);background:#0F172A;color:var(--ink-900);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--blue-600);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}

/* ============================================================
   PROTOTIP QOBIG'I — navigator + sahna
   ============================================================ */
.shell{display:flex;height:100vh}

/* --- Navigator --- */
.nav{width:280px;flex:none;background:#0F172A;color:#CBD5E1;
  display:flex;flex-direction:column;border-right:1px solid #1E293B}
.nav__head{padding:20px 18px 14px;border-bottom:1px solid #1E293B}
.nav__logo{font-family:var(--font-display);font-weight:800;font-size:15px;color:#fff;letter-spacing:-.01em}
.nav__sub{font-size:11px;color:#64748B;margin-top:3px}
.nav__scroll{flex:1;overflow-y:auto;padding:10px 10px 24px}
.nav__group{margin-top:14px}
.nav__group:first-child{margin-top:4px}
.nav__gtitle{font-size:10px;font-weight:700;letter-spacing:.09em;color:#475569;
  text-transform:uppercase;padding:6px 8px}
.nav__item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:8px 9px;border-radius:8px;font-size:13px;color:#94A3B8;
  transition:background var(--dur-fast) var(--ease-standard),color var(--dur-fast)}
.nav__item:hover{background:#1E293B;color:#E2E8F0}
.nav__item.is-active{background:var(--blue-600);color:#fff;font-weight:600}
.nav__id{font-family:var(--font-data);font-size:10px;color:#475569;flex:none;width:38px}
.nav__item.is-active .nav__id{color:#BFDBFE}
.nav__label{flex:1;line-height:1.3}
.nav__foot{padding:12px 16px;border-top:1px solid #1E293B;font-size:11px;color:#475569}

/* --- Sahna --- */
.stage{flex:1;background:#1E293B;position:relative;overflow:auto;
  display:flex;align-items:flex-start;justify-content:center;padding:28px}
.stage__inner{position:relative}
.frame{background:var(--canvas);border-radius:10px;overflow:hidden;
  box-shadow:0 24px 64px rgba(0,0,0,.45);transform-origin:top center}
.frame--tv{background:var(--ink-900)}
.caption{position:absolute;top:-22px;left:0;font-size:12px;color:#94A3B8;
  font-weight:500;display:flex;gap:8px;align-items:center}
.caption .mono{color:#64748B;font-size:11px}

/* Holat almashtirgich (stage ustida) */
.statebar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:rgba(15,23,42,.94);backdrop-filter:blur(8px);border:1px solid #334155;
  border-radius:var(--r-chip);padding:6px;display:flex;gap:4px;z-index:900;
  box-shadow:0 12px 32px rgba(0,0,0,.4)}
.statebar button{font-size:12px;padding:7px 13px;border-radius:var(--r-chip);
  color:#94A3B8;font-weight:500;transition:all var(--dur-fast)}
.statebar button:hover{background:#1E293B;color:#E2E8F0}
.statebar button.is-active{background:#fff;color:var(--ink-900);font-weight:600}

/* ============================================================
   ILOVA — umumiy komponentlar
   ============================================================ */
.app{width:1440px;height:900px;display:flex;flex-direction:column;
  background:var(--canvas);position:relative;overflow:hidden}

/* TopBar */
.topbar{height:64px;flex:none;background:var(--surface);box-shadow:var(--e-1);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;
  position:relative;z-index:30}
.topbar__l{display:flex;align-items:center;gap:32px}
.brand{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:-.01em}
.tabs{display:flex;gap:4px}
.tab{padding:8px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink-500);
  transition:background var(--dur-fast),color var(--dur-fast)}
.tab:hover{background:var(--ink-100);color:var(--ink-700)}
.tab.is-active{background:var(--blue-100);color:var(--blue-600);font-weight:600}
.topbar__r{display:flex;align-items:center;gap:16px}

/* ConnectionPill — SSE holati */
.conn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;
  border-radius:var(--r-chip);font-size:12px;font-weight:500;border:1px solid;
  transition:all var(--dur-base)}
.conn__dot{width:8px;height:8px;border-radius:50%;flex:none}
.conn--live{background:var(--success-bg);color:var(--success);border-color:var(--success)}
.conn--live .conn__dot{background:var(--success);animation:pulseDot 2.4s infinite}
.conn--recon{background:var(--warning-bg);color:var(--warning);border-color:var(--warning)}
.conn--recon .conn__dot{background:var(--warning);animation:pulseDot .9s infinite}
.conn--off{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.conn--off .conn__dot{background:var(--danger)}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}

.user{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 4px;border-radius:var(--r-chip);
  transition:background var(--dur-fast)}
.user:hover{background:var(--ink-100)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blue-600);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.user__name{font-size:14px;font-weight:500}
.caret{font-size:10px;color:var(--ink-500)}

/* SubHeader */
.subhead{height:48px;flex:none;background:var(--surface);border-bottom:1px solid var(--ink-200);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;
  position:relative;z-index:20}
.subhead__l{display:flex;align-items:center;gap:12px}
.today{font-size:14px;font-weight:500}

/* Badge */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:var(--r-chip);
  font-size:12px;font-weight:500}
.badge--n{background:var(--ink-100);color:var(--ink-500)}
.badge--t{background:var(--teal-bg);color:var(--teal)}
.badge--w{background:var(--warning-bg);color:var(--warning)}
.badge--s{background:var(--success-bg);color:var(--success)}
.badge--d{background:var(--danger-bg);color:var(--danger)}
.badge--i{background:var(--info-bg);color:var(--info)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;border-radius:var(--r-input);font-size:14px;font-weight:600;
  transition:background var(--dur-fast),box-shadow var(--dur-fast),transform var(--dur-fast);
  min-height:40px}
.btn:active{transform:scale(.985)}
.btn--p{background:var(--blue-600);color:#fff}
.btn--p:hover{background:var(--blue-500)}
.btn--s{background:var(--surface);color:var(--ink-700);border:1px solid var(--ink-200)}
.btn--s:hover{background:var(--ink-100)}
.btn--g{background:transparent;color:var(--blue-600);font-weight:500}
.btn--g:hover{background:var(--blue-50)}
.btn--d{background:var(--danger);color:#fff}
.btn--hero{min-height:72px;font-size:20px;border-radius:var(--r-card);padding:0 40px}
.btn[disabled]{opacity:.5;pointer-events:none}
.kbd{font-family:var(--font-data);font-size:11px;padding:2px 6px;border-radius:4px;
  background:rgba(255,255,255,.2)}
.kbd--l{background:var(--ink-100);color:var(--ink-500)}

/* Chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--r-chip);
  font-size:13px;font-weight:500;background:var(--surface);border:1px solid var(--ink-200);
  color:var(--ink-700);transition:all var(--dur-fast)}
.chip:hover{border-color:var(--ink-300)}
.chip.is-active{background:var(--ink-900);color:#fff;border-color:var(--ink-900)}
.chip__n{padding:1px 6px;border-radius:var(--r-chip);background:var(--ink-100);
  font-size:11px;font-weight:600;color:var(--ink-500)}
.chip.is-active .chip__n{background:rgba(255,255,255,.25);color:#fff}

/* ============================================================
   S-10 — NAVBAT BOSHQARUVI
   ============================================================ */
.board{flex:1;display:flex;gap:16px;padding:20px 24px;overflow:hidden}
.col{flex:1;min-width:0;background:var(--surface);border:1px solid var(--ink-200);
  border-radius:var(--r-card);display:flex;flex-direction:column;overflow:hidden}
.col__hd{display:flex;align-items:center;gap:10px;padding:14px 16px;
  border-bottom:1px solid var(--ink-200)}
.col__bar{width:4px;height:36px;border-radius:2px;flex:none}
.col__info{min-width:0;flex:1}
.col__name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col__meta{font-size:12px;color:var(--ink-500);margin-top:2px}
.col__pause{font-size:11px;font-weight:600;color:var(--warning);background:var(--warning-bg);
  padding:3px 8px;border-radius:var(--r-chip)}
.col__body{flex:1;overflow-y:auto;padding:4px 8px 8px}
.slabel{font-size:11px;font-weight:600;letter-spacing:.5px;padding:10px 8px 4px}
.slabel--ip{color:var(--teal)} .slabel--ca{color:var(--blue-600)} .slabel--w{color:var(--ink-500)}

/* Navbat kartochkasi */
.tk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
  cursor:pointer;position:relative;transition:background var(--dur-fast)}
.tk:hover{background:var(--ink-100)}
.tk__code{font-family:var(--font-data);font-size:14px;font-weight:500;flex:none;
  font-variant-numeric:tabular-nums}
.tk__name{flex:1;font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk__time{font-size:12px;color:var(--ink-500);flex:none}
.tk--ip{background:var(--teal-bg);border-radius:var(--r-input)}
.tk--ip .tk__code{color:var(--teal)} .tk--ip .tk__name{font-weight:600}
.tk--ip:hover{background:#B9F3FA}
.tk--ca{background:var(--blue-600);color:#fff;border-radius:var(--r-input);
  animation:callPulse .6s var(--ease-overshoot) 3}
.tk--ca .tk__code,.tk--ca .tk__name{color:#fff}
.tk--ca .tk__name{font-weight:600}
.tk--ca .tk__time{color:rgba(255,255,255,.75)}
.tk--ca:hover{background:var(--blue-500)}
.tk--noshow{opacity:.55}
.tk--noshow .tk__name{text-decoration:line-through}
@keyframes callPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@media (prefers-reduced-motion:reduce){
  .tk--ca{animation:none;box-shadow:0 0 0 3px var(--blue-100)}
  .conn__dot{animation:none!important}
}
/* Hover amallari */
.tk__acts{display:none;gap:4px;flex:none}
.tk:hover .tk__acts{display:flex}
.tk:hover .tk__time{display:none}
.iconbtn{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;
  font-size:13px;background:var(--surface);border:1px solid var(--ink-200);color:var(--ink-700)}
.iconbtn:hover{background:var(--blue-50);border-color:var(--blue-500);color:var(--blue-600)}
.tk--ca .iconbtn,.tk--ip .iconbtn{background:rgba(255,255,255,.9)}

/* Bo'sh holat */
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:56px 16px;text-align:center}
.empty__ic{width:44px;height:44px;border-radius:12px;background:var(--ink-100);
  display:grid;place-items:center;font-size:18px}
.empty__t{font-size:14px;color:var(--ink-500)}
.empty__s{font-size:12px;color:var(--ink-300)}

/* Skeleton */
.sk{background:linear-gradient(90deg,var(--ink-100) 25%,#E8EEF6 37%,var(--ink-100) 63%);
  background-size:400% 100%;animation:shimmer 1.4s infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ============================================================
   Overlay / Drawer / Modal / Menu
   ============================================================ */
.scrim{position:absolute;inset:0;background:rgba(11,31,58,.32);z-index:40;
  animation:fadeIn var(--dur-enter) var(--ease-enter)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.drawer{position:absolute;top:0;right:0;bottom:0;width:480px;background:var(--surface);
  box-shadow:var(--e-3);z-index:50;display:flex;flex-direction:column;
  animation:slideIn var(--dur-enter) var(--ease-enter)}
@keyframes slideIn{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.drawer__hd{display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;border-bottom:1px solid var(--ink-200)}
.drawer__ttl{font-size:18px;font-weight:600}
.drawer__body{flex:1;overflow-y:auto;padding:16px 24px 24px;display:flex;flex-direction:column;gap:16px}
.drawer__ft{padding:16px 24px 20px;border-top:1px solid var(--ink-200);background:var(--canvas);
  display:flex;gap:12px}
.drawer__ft .btn--p{flex:1}
.x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
  font-size:16px;color:var(--ink-500)}
.x:hover{background:var(--ink-100);color:var(--ink-900)}

/* Steps */
.steps{display:flex;align-items:center;gap:8px;padding:20px 24px 0}
.step{display:flex;align-items:center;gap:8px}
.step__n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:600;background:var(--ink-200);color:var(--ink-500)}
.step__l{font-size:14px;font-weight:500;color:var(--ink-500)}
.step.is-active .step__n{background:var(--blue-600);color:#fff}
.step.is-active .step__l{color:var(--ink-900);font-weight:600}
.step.is-done .step__n{background:var(--success);color:#fff}
.step__line{width:40px;height:2px;background:var(--ink-200);border-radius:1px}

/* Form */
.field{display:flex;flex-direction:column;gap:6px}
.field__l{font-size:13px;font-weight:500;color:var(--ink-700)}
.input{width:100%;padding:12px 14px;border-radius:var(--r-input);font-size:15px;
  border:1px solid var(--ink-200);background:var(--surface);font-family:inherit;color:var(--ink-900);
  transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
.input:focus{outline:none;border-color:var(--blue-600);box-shadow:0 0 0 3px var(--blue-100)}
.input.is-err{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-bg)}
.field__h{font-size:12px;color:var(--ink-500)}
.field__e{font-size:12px;color:var(--danger);font-weight:500;display:flex;gap:5px;align-items:center}

.result{padding:14px 16px;border-radius:var(--r-card);background:var(--blue-50);
  border:1px solid var(--blue-100)}
.result__r{display:flex;align-items:center;gap:8px}
.result__n{font-size:15px;font-weight:600;flex:1}
.result__s{font-size:13px;color:var(--ink-500);margin-top:6px}
.option{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:var(--r-card);
  background:var(--surface);border:1px solid var(--ink-200);cursor:pointer;
  transition:border-color var(--dur-fast),background var(--dur-fast)}
.option:hover{border-color:var(--ink-300);background:var(--canvas)}
.option.is-sel{border-color:var(--blue-600);border-width:2px;background:var(--blue-50)}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink-300);flex:none;
  display:grid;place-items:center}
.option.is-sel .radio{border-color:var(--blue-600)}
.option.is-sel .radio::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--blue-600)}

/* Doctor pick card */
.dpick{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r-card);
  background:var(--surface);border:1px solid var(--ink-200);cursor:pointer;
  transition:border-color var(--dur-fast),background var(--dur-fast)}
.dpick:hover{border-color:var(--ink-300);background:var(--canvas)}
.dpick.is-sel{border-color:var(--blue-600);border-width:2px;background:var(--blue-50)}
.dpick__sq{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;
  font-family:var(--font-data);font-size:16px;font-weight:700;color:#fff;flex:none}
.dpick__i{flex:1;min-width:0}
.dpick__n{font-size:14px;font-weight:600}
.dpick__m{font-size:12px;color:var(--ink-500);margin-top:2px}

/* Selected chip */
.selchip{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-input);
  background:var(--canvas);border:1px solid var(--ink-200);font-size:14px}
.selchip__t{flex:1;font-weight:500}

/* Menu */
.menu{position:absolute;z-index:60;width:280px;background:var(--surface);
  border:1px solid var(--ink-200);border-radius:var(--r-card);box-shadow:var(--e-3);
  overflow:hidden;animation:menuIn var(--dur-enter) var(--ease-enter)}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.menu__hd{display:flex;gap:10px;align-items:center;padding:14px 16px;background:var(--canvas)}
.menu__n{font-size:14px;font-weight:600}
.menu__r{font-size:12px;color:var(--ink-500);margin-top:2px}
.menu__sec{padding:12px}
.menu__st{font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--ink-500);
  padding:0 4px 6px}
.seg{display:flex;gap:2px;padding:3px;background:var(--ink-100);border-radius:var(--r-input)}
.seg button{flex:1;padding:7px 8px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-500)}
.seg button.is-active{background:var(--surface);color:var(--ink-900);font-weight:600;box-shadow:var(--e-1)}
.menu__item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 16px;
  font-size:14px;font-weight:500;color:var(--ink-700);text-align:left}
.menu__item:hover{background:var(--ink-100)}
.menu__item span:first-child{flex:1}
.menu__ref{font-family:var(--font-data);font-size:10px;color:var(--ink-300)}
.menu__item--d{color:var(--danger)}
.menu__item--d:hover{background:var(--danger-bg)}
.hr{height:1px;background:var(--ink-200)}

/* Modal */
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;
  width:520px;background:var(--surface);border-radius:var(--r-modal);box-shadow:var(--e-3);
  overflow:hidden;animation:modalIn var(--dur-enter) var(--ease-enter)}
@keyframes modalIn{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.modal__hd{padding:20px 24px 0}
.modal__ttl{font-size:18px;font-weight:600}
.modal__sub{font-size:13px;color:var(--ink-500);margin-top:4px}
.modal__body{padding:20px 24px;display:flex;flex-direction:column;gap:12px}
.modal__ft{padding:16px 24px;background:var(--canvas);border-top:1px solid var(--ink-200);
  display:flex;gap:12px;justify-content:flex-end}

/* Outcome buttons */
.outcome{display:flex;align-items:flex-start;gap:12px;padding:16px;border-radius:var(--r-card);
  border:1px solid var(--ink-200);background:var(--surface);text-align:left;width:100%;
  transition:all var(--dur-fast)}
.outcome:hover{border-color:var(--ink-300);background:var(--canvas)}
.outcome__ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  font-size:16px;flex:none}
.outcome__t{font-size:14px;font-weight:600}
.outcome__d{font-size:12px;color:var(--ink-500);margin-top:3px;line-height:1.45}
.outcome--ok:hover{border-color:var(--success)}
.outcome--ok .outcome__ic{background:var(--success-bg);color:var(--success)}
.outcome--warn:hover{border-color:var(--warning)}
.outcome--warn .outcome__ic{background:var(--warning-bg);color:var(--warning)}
.outcome--na:hover{border-color:var(--ink-500)}
.outcome--na .outcome__ic{background:var(--ink-100);color:var(--ink-500)}

/* Toast */
.toast{position:absolute;right:24px;bottom:24px;z-index:70;display:flex;gap:10px;
  align-items:flex-start;padding:14px 16px;border-radius:var(--r-card);background:var(--ink-900);
  color:#fff;box-shadow:var(--e-3);max-width:380px;
  animation:toastIn var(--dur-enter) var(--ease-overshoot)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.toast__t{font-size:14px;font-weight:600}
.toast__d{font-size:12px;color:#94A3B8;margin-top:3px}

/* ============================================================
   Umumiy sahifa layout (Bemorlar, Qo'ng'iroqlar, h.k.)
   ============================================================ */
.page{flex:1;padding:20px 24px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.page__hd{display:flex;align-items:center;gap:16px}
.page__ttl{font-size:24px;font-weight:700;font-family:var(--font-display);letter-spacing:-.01em}
.page__sub{font-size:13px;color:var(--ink-500);margin-top:2px}
.spacer{flex:1}

.search{display:flex;align-items:center;gap:8px;width:340px;padding:11px 14px;
  border-radius:var(--r-input);background:var(--surface);border:1px solid var(--ink-200)}
.search input{flex:1;border:none;outline:none;font:inherit;font-size:14px;background:none}
.search input::placeholder{color:var(--ink-500)}

/* Table */
.tbl{flex:1;background:var(--surface);border:1px solid var(--ink-200);border-radius:var(--r-card);
  overflow:hidden;display:flex;flex-direction:column}
.tbl__hd,.tbl__row{display:grid;align-items:center;gap:16px;padding:0 20px}
.tbl__hd{background:var(--canvas);border-bottom:1px solid var(--ink-200);height:44px;
  font-size:12px;font-weight:600;color:var(--ink-500);letter-spacing:.3px}
.tbl__body{flex:1;overflow-y:auto}
.tbl__row{height:52px;border-bottom:1px solid var(--ink-200);font-size:14px;cursor:pointer;
  transition:background var(--dur-fast)}
.tbl__row:nth-child(even){background:#FCFDFE}
.tbl__row:hover{background:var(--blue-50)}
.tbl__row:last-child{border-bottom:none}
.cell--strong{font-weight:600}
.cell--r{text-align:right}
.cell--sub{color:var(--ink-500)}

/* Call cards */
.calls{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.call{display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--surface);
  border:1px solid var(--ink-200);border-radius:var(--r-card)}
.call.is-due{border-color:var(--blue-100);border-width:2px;padding:15px 19px}
.call__i{flex:1;min-width:0}
.call__r1{display:flex;align-items:center;gap:10px}
.call__n{font-size:16px;font-weight:600}
.call__ph{font-family:var(--font-data);font-size:13px;color:var(--ink-500)}
.call__r2{font-size:13px;color:var(--ink-500);margin-top:4px}

/* Progress */
.prog{width:280px;padding:12px 16px;background:var(--surface);border:1px solid var(--ink-200);
  border-radius:var(--r-card)}
.prog__r{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
.prog__bar{height:6px;border-radius:var(--r-chip);background:var(--ink-100);overflow:hidden}
.prog__fill{height:100%;border-radius:var(--r-chip);background:var(--success);
  transition:width var(--dur-base) var(--ease-standard)}

/* ============================================================
   S-20 — SHIFOKOR EKRANI
   ============================================================ */
.doc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:24px;padding:40px}
.doc__now{width:520px;padding:32px;background:var(--surface);border:1px solid var(--ink-200);
  border-radius:var(--r-card);text-align:center;box-shadow:var(--e-1)}
.doc__code{font-family:var(--font-display);font-size:96px;font-weight:800;line-height:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.doc__name{font-size:22px;font-weight:600;margin-top:12px}
.doc__meta{font-size:14px;color:var(--ink-500);margin-top:6px}
.doc__acts{display:flex;gap:12px;justify-content:center;margin-top:24px}
.doc__next{font-size:14px;color:var(--ink-500)}
.doc__q{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-500)}
.doc__q .mono{font-size:13px;color:var(--ink-700);font-weight:500}

/* ============================================================
   S-50 — TV DISPLAY
   ============================================================ */
.tv{width:1920px;height:1080px;background:var(--ink-900);color:#F2F7FF;
  display:flex;flex-direction:column;padding:64px;font-family:var(--font-display)}
.tv__main{flex:1;display:flex;gap:56px;min-height:0}
.tv__l{flex:1.62;display:flex;flex-direction:column;gap:28px;min-width:0}
.tv__r{flex:1;display:flex;flex-direction:column;gap:24px;min-width:0}
.tv__lbl{font-size:28px;font-weight:700;letter-spacing:.14em;color:#64789B;
  text-transform:uppercase;font-family:var(--font-ui)}
.tvcard{display:flex;align-items:center;gap:36px;padding:40px 44px;border-radius:var(--r-tv);
  background:#132845;border-left:14px solid var(--doc-1)}
.tvcard--hero{padding:56px 48px}
.tvcard--hero .tvcard__code{font-size:200px}
.tvcard__code{font-size:120px;font-weight:800;line-height:.92;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;flex:none}
.tvcard__i{flex:1;min-width:0}
.tvcard__room{font-size:76px;font-weight:800;line-height:1.05;letter-spacing:-.01em}
.tvcard--hero .tvcard__room{font-size:96px}
.tvcard__doc{font-size:34px;font-weight:600;color:#9DB4D4;margin-top:10px}
.tvcard.is-calling{animation:tvPulse .6s var(--ease-overshoot) 3}
@keyframes tvPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
.tvnext{display:flex;align-items:center;gap:24px;padding:22px 28px;border-radius:20px;
  background:rgba(255,255,255,.045);border-left:8px solid var(--doc-1)}
.tvnext__code{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.tvnext__d{font-size:26px;color:#8FA6C6;font-weight:600;font-family:var(--font-ui)}
.tv__ft{height:96px;flex:none;display:flex;align-items:center;justify-content:space-between;
  border-top:1px solid rgba(255,255,255,.09);margin-top:40px;font-family:var(--font-ui)}
.tv__brand{font-family:var(--font-display);font-size:34px;font-weight:800}
.tv__note{font-size:26px;color:#8FA6C6}
.tv__time{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums}
.tv__empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.tv__empty h2{font-size:72px;font-weight:800}
.tv__empty p{font-size:32px;color:#8FA6C6;font-family:var(--font-ui)}

/* Pairing */
.pair{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  font-family:var(--font-ui)}
.pair__code{font-family:var(--font-data);font-size:120px;font-weight:700;letter-spacing:.16em;
  color:#F2F7FF;padding:32px 48px;border:3px dashed #2E4A73;border-radius:var(--r-tv)}
.pair__steps{display:flex;gap:40px;margin-top:12px}
.pair__step{width:280px;text-align:center;color:#8FA6C6;font-size:20px;line-height:1.5}
.pair__num{width:44px;height:44px;border-radius:50%;background:#1D3557;color:#fff;
  display:grid;place-items:center;font-weight:700;margin:0 auto 12px;font-size:20px}

/* ============================================================
   S-00 LOGIN
   ============================================================ */
.login{flex:1;display:grid;place-items:center;background:var(--canvas)}
.login__card{width:420px;padding:40px;background:var(--surface);border-radius:var(--r-modal);
  box-shadow:var(--e-2);border:1px solid var(--ink-200)}
.login__brand{font-family:var(--font-display);font-size:24px;font-weight:800;text-align:center}
.login__sub{font-size:14px;color:var(--ink-500);text-align:center;margin-top:6px;margin-bottom:28px}
.login__f{display:flex;flex-direction:column;gap:16px}

/* ============================================================
   Holat ekranlari
   ============================================================ */
.state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;text-align:center;padding:40px}
.state__ic{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;font-size:30px}
.state__t{font-size:24px;font-weight:700;font-family:var(--font-display)}
.state__d{font-size:15px;color:var(--ink-500);max-width:420px;line-height:1.55}

/* ============================================================
   Qabul yozuvi / Kassa / Profil komponentlari
   ============================================================ */
/* Ikki ustunli ish maydoni */
.split{flex:1;display:flex;gap:16px;min-height:0}
.pane{background:var(--surface);border:1px solid var(--ink-200);border-radius:var(--r-card);
  display:flex;flex-direction:column;overflow:hidden}
.pane__hd{padding:16px 20px;border-bottom:1px solid var(--ink-200);display:flex;
  align-items:center;justify-content:space-between}
.pane__t{font-size:15px;font-weight:600}
.pane__b{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.pane__ft{padding:14px 20px;border-top:1px solid var(--ink-200);background:var(--canvas);
  display:flex;gap:10px;align-items:center}

.ta{width:100%;padding:12px 14px;border-radius:var(--r-input);border:1px solid var(--ink-200);
  font:inherit;font-size:14px;resize:none;min-height:84px;line-height:1.55;color:var(--ink-900)}
.ta:focus{outline:none;border-color:var(--blue-600);box-shadow:0 0 0 3px var(--blue-100)}

/* Xizmat tanlagich */
.srv{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-input);
  border:1px solid var(--ink-200);background:var(--surface);cursor:pointer;
  transition:border-color var(--dur-fast),background var(--dur-fast)}
.srv:hover{border-color:var(--ink-300);background:var(--canvas)}
.srv.is-sel{border-color:var(--blue-600);background:var(--blue-50)}
.cbx{width:20px;height:20px;border-radius:6px;border:2px solid var(--ink-300);flex:none;
  display:grid;place-items:center;font-size:12px;color:#fff;background:var(--surface)}
.srv.is-sel .cbx{background:var(--blue-600);border-color:var(--blue-600)}
.srv__n{flex:1;font-size:14px;font-weight:500}
.srv__p{font-family:var(--font-data);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}

/* Jami summa */
.total{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;
  border-radius:var(--r-card);background:var(--ink-900);color:#fff}
.total__l{font-size:14px;color:#94A3B8}
.total__v{font-family:var(--font-data);font-size:24px;font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* Qayta ko'rik bloki */
.recheck{border:1px solid var(--ink-200);border-radius:var(--r-card);overflow:hidden}
.recheck__hd{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;
  background:var(--surface);transition:background var(--dur-fast)}
.recheck__hd:hover{background:var(--canvas)}
.recheck.is-on .recheck__hd{background:var(--blue-50);border-bottom:1px solid var(--blue-100)}
.recheck__t{flex:1;font-size:14px;font-weight:600}
.recheck__s{font-size:12px;color:var(--ink-500);margin-top:2px;font-weight:400}
.recheck__b{padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--blue-50)}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.preset{padding:8px 14px;border-radius:var(--r-chip);font-size:13px;font-weight:500;
  background:var(--surface);border:1px solid var(--ink-200);color:var(--ink-700)}
.preset:hover{border-color:var(--blue-500)}
.preset.is-active{background:var(--blue-600);color:#fff;border-color:var(--blue-600)}
.datebox{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-input);
  background:var(--surface);border:1px solid var(--blue-100)}
.datebox__d{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.01em}
.datebox__m{font-size:12px;color:var(--ink-500);margin-top:2px}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-input);
  background:var(--info-bg);font-size:12px;color:var(--info);line-height:1.55}

/* Vaqt slotlari */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{padding:11px 6px;border-radius:var(--r-input);font-family:var(--font-data);font-size:14px;
  font-weight:500;background:var(--surface);border:1px solid var(--ink-200);color:var(--ink-700)}
.slot:hover{border-color:var(--blue-500);background:var(--blue-50)}
.slot.is-sel{background:var(--blue-600);color:#fff;border-color:var(--blue-600)}
.slot.is-busy{background:var(--ink-100);color:var(--ink-300);pointer-events:none;
  text-decoration:line-through}

/* To'lov usullari */
.pms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pm{padding:16px 12px;border-radius:var(--r-card);border:1px solid var(--ink-200);
  background:var(--surface);text-align:center;transition:all var(--dur-fast)}
.pm:hover{border-color:var(--ink-300)}
.pm.is-sel{border-color:var(--blue-600);border-width:2px;background:var(--blue-50);padding:15px 11px}
.pm__ic{font-size:22px}
.pm__t{font-size:13px;font-weight:600;margin-top:6px}
.pm__s{font-size:11px;color:var(--ink-500);margin-top:2px}

/* Chek ko'rinishi */
.receipt{width:280px;padding:20px 18px;background:#fff;border:1px solid var(--ink-200);
  border-radius:8px;font-family:var(--font-data);font-size:12px;line-height:1.7;color:var(--ink-900)}
.receipt__c{text-align:center}
.receipt__hr{border-top:1px dashed var(--ink-300);margin:10px 0}
.receipt__big{font-size:34px;font-weight:700;letter-spacing:.08em;text-align:center;margin:6px 0}
.receipt__row{display:flex;justify-content:space-between;gap:10px}

/* Smena */
.shiftbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:var(--r-card);
  background:var(--success-bg);border:1px solid var(--success)}
.shiftbar__t{flex:1;font-size:13px;color:var(--success);font-weight:600}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{padding:16px 18px;background:var(--surface);border:1px solid var(--ink-200);
  border-radius:var(--r-card)}
.kpi__l{font-size:12px;color:var(--ink-500);font-weight:500}
.kpi__v{font-family:var(--font-display);font-size:26px;font-weight:800;margin-top:6px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi__d{font-size:11px;color:var(--ink-500);margin-top:4px}

/* Profil */
.prof{display:flex;gap:16px;flex:1;min-height:0}
.prof__side{width:300px;flex:none;display:flex;flex-direction:column;gap:12px}
.prof__card{padding:24px;background:var(--surface);border:1px solid var(--ink-200);
  border-radius:var(--r-card);text-align:center}
.prof__nav{background:var(--surface);border:1px solid var(--ink-200);border-radius:var(--r-card);
  padding:6px;display:flex;flex-direction:column;gap:2px}
.prof__ni{padding:10px 14px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink-700);
  text-align:left}
.prof__ni:hover{background:var(--ink-100)}
.prof__ni.is-active{background:var(--blue-50);color:var(--blue-600);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv{display:flex;justify-content:space-between;padding:10px 0;font-size:14px;
  border-bottom:1px solid var(--ink-200)}
.kv:last-child{border-bottom:none}
.kv__k{color:var(--ink-500)}
.kv__v{font-weight:500}

/* Tabs (sahifa ichida) */
.ptabs{display:flex;gap:2px;padding:3px;background:var(--ink-100);border-radius:var(--r-input);
  align-self:flex-start}
.ptab{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-500)}
.ptab.is-active{background:var(--surface);color:var(--ink-900);font-weight:600;box-shadow:var(--e-1)}
.ptab__n{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:var(--r-chip);
  background:var(--ink-200);font-size:11px;font-weight:600}
.ptab.is-active .ptab__n{background:var(--blue-100);color:var(--blue-600)}

/* Oldindan yozuv belgisi navbat kartochkasida */
.tk__bk{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;
  background:var(--info-bg);color:var(--info);flex:none}

/* ============================================================
   ANALITIKA — diagrammalar
   ============================================================ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.card{background:var(--surface);border:1px solid var(--ink-200);border-radius:var(--r-card);
  padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.card__hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card__t{font-size:14px;font-weight:600}
.card__s{font-size:12px;color:var(--ink-500);margin-top:3px;line-height:1.45}

.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;
  padding:2px 7px;border-radius:var(--r-chip)}
.delta--up{background:var(--success-bg);color:var(--success)}
.delta--dn{background:var(--danger-bg);color:var(--danger)}
.delta--fl{background:var(--ink-100);color:var(--ink-500)}

.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  gap:6px;height:100%;position:relative}
.bar__v{width:100%;border-radius:5px 5px 2px 2px;background:var(--blue-500);min-height:3px;
  transition:background var(--dur-fast)}
.bar:hover .bar__v{background:var(--blue-700)}
.bar--wk .bar__v{background:var(--ink-200)}
.bar__l{font-size:10px;color:var(--ink-500);font-variant-numeric:tabular-nums}
.bar__t{position:absolute;top:-4px;font-family:var(--font-data);font-size:10px;
  font-weight:600;color:var(--ink-700);opacity:0;transition:opacity var(--dur-fast)}
.bar:hover .bar__t{opacity:1}

.hbars{display:flex;flex-direction:column;gap:11px}
.hbar__r{display:flex;align-items:center;gap:10px;font-size:13px}
.hbar__n{width:160px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar__t{flex:1;height:22px;border-radius:5px;background:var(--ink-100);overflow:hidden}
.hbar__f{height:100%;border-radius:5px;transition:width var(--dur-base) var(--ease-standard)}
.hbar__v{width:100px;flex:none;text-align:right;font-family:var(--font-data);font-size:12px;
  font-weight:600;font-variant-numeric:tabular-nums}

.donut{display:flex;align-items:center;gap:20px}
.donut__lg{display:flex;flex-direction:column;gap:9px;flex:1}
.donut__i{display:flex;align-items:center;gap:8px;font-size:13px}
.donut__d{width:10px;height:10px;border-radius:3px;flex:none}
.donut__n{flex:1;color:var(--ink-700)}
.donut__v{font-family:var(--font-data);font-weight:600;font-variant-numeric:tabular-nums}

.heat{display:flex;flex-direction:column;gap:4px}
.heat__r{display:flex;gap:4px;align-items:center}
.heat__lb{width:26px;flex:none;font-size:11px;color:var(--ink-500);font-weight:500}
.heat__c{flex:1;aspect-ratio:1.3;border-radius:4px;display:grid;place-items:center;
  font-size:10px;font-weight:600;font-variant-numeric:tabular-nums}
.heat__hd{display:flex;gap:4px;padding-left:30px}
.heat__hc{flex:1;text-align:center;font-size:10px;color:var(--ink-500);font-weight:500}
.heat__lg{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-500);margin-top:4px}
.heat__sw{display:flex;gap:3px}
.heat__sw i{width:16px;height:10px;border-radius:2px;display:block}

.funnel{display:flex;flex-direction:column;gap:8px}
.fstep{display:flex;align-items:center;gap:12px}
.fstep__b{height:44px;border-radius:8px;display:flex;align-items:center;padding:0 14px;
  color:#fff;font-weight:600;font-size:14px}
.fstep__i{flex:1;font-size:12px;color:var(--ink-500);line-height:1.4}
.fstep__loss{color:var(--danger);font-weight:600}

.dist{position:relative;height:56px;margin:10px 0 16px}
.dist__t{position:absolute;left:0;right:0;top:20px;height:8px;border-radius:4px;
  background:linear-gradient(90deg,var(--success) 0%,var(--success) 32%,
    var(--warning) 60%,var(--danger) 100%)}
.dist__m{position:absolute;top:10px;width:2px;height:28px;background:var(--ink-900);border-radius:1px}
.dist__lb{position:absolute;top:40px;transform:translateX(-50%);font-size:11px;
  font-weight:600;white-space:nowrap}

.period{display:flex;gap:2px;padding:3px;background:var(--ink-100);border-radius:var(--r-input)}
.period button{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-500)}
.period button.is-active{background:var(--surface);color:var(--ink-900);font-weight:600;box-shadow:var(--e-1)}

.alert{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-input);
  font-size:13px;line-height:1.5;align-items:flex-start}
.alert--w{background:var(--warning-bg);color:var(--warning)}
.alert--d{background:var(--danger-bg);color:var(--danger)}
.alert--s{background:var(--success-bg);color:var(--success)}

.atbl{width:100%;border-collapse:collapse;font-size:13px}
.atbl th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;color:var(--ink-500);
  letter-spacing:.3px;border-bottom:1px solid var(--ink-200);white-space:nowrap}
.atbl th.r,.atbl td.r{text-align:right}
.atbl td{padding:12px;border-bottom:1px solid var(--ink-200)}
.atbl tr:last-child td{border-bottom:none}
.atbl tbody tr:hover{background:var(--blue-50)}
.dotname{display:flex;align-items:center;gap:8px}
.dotname i{width:8px;height:8px;border-radius:2px;flex:none}
.scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:2px}

.flow{width:1440px;background:var(--canvas);padding:40px 48px;display:flex;
  flex-direction:column;gap:28px}
.flow__h1{font-size:28px;font-weight:800;font-family:var(--font-display);letter-spacing:-.02em}
.flow__sub{font-size:14px;color:var(--ink-500);margin-top:6px;max-width:760px;line-height:1.6}
.lane{display:flex;gap:14px;align-items:stretch}
.lane__t{width:150px;flex:none;font-size:12px;font-weight:700;letter-spacing:.06em;
  color:var(--ink-500);text-transform:uppercase;padding-top:18px}
.lane__s{flex:1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fnode{padding:12px 14px;border-radius:var(--r-input);background:var(--surface);
  border:1px solid var(--ink-200);min-width:150px;cursor:pointer;
  transition:border-color var(--dur-fast),box-shadow var(--dur-fast),transform var(--dur-fast)}
.fnode:hover{border-color:var(--blue-600);box-shadow:var(--e-2);transform:translateY(-1px)}
.fnode__id{font-family:var(--font-data);font-size:10px;color:var(--ink-300)}
.fnode__t{font-size:13px;font-weight:600;margin-top:3px}
.fnode__d{font-size:11px;color:var(--ink-500);margin-top:3px;line-height:1.4}
.fnode--done{border-left:3px solid var(--success)}
.fnode--todo{border-left:3px solid var(--ink-300);opacity:.75}
.arr{color:var(--ink-300);font-size:16px;flex:none}
.legend{display:flex;gap:20px;font-size:12px;color:var(--ink-500);align-items:center}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
</style>

  let body='';
  if(S.variant==='loading'){

        <div style="font-size:13px;font-weight:600;margin-bottom:10px">Nima yoqdi?</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${[['Tushuntirib berdi',1],['Kutish kam',1],['Toza va qulay',0],
             ['Narx adolatli',0],['Xushmuomala',1],['Natija bo\'ldi',0]]
            .map(([t,a])=>`<span class="chip ${a?'is-active':''}" style="font-size:12px">${t}</span>`).join('')}
        </div>
      </div>

      <div class="field">
        <label class="field__l">Izoh (ixtiyoriy)</label>
        <textarea class="ta" style="min-height:90px"
          placeholder="Tajribangiz haqida yozing..."></textarea>
      </div>

      <div style="padding:12px 14px;background:var(--info-bg);border-radius:var(--r-input);
        font-size:12px;color:var(--info);line-height:1.5">
        ℹ Izohingiz ShifoTop'da klinika sahifasida ko'rinadi. Ismingiz qisqartirilib
        chiqadi: <b>Anvar A.</b>
      </div>
    </div>

    <div style="padding:16px 20px;background:var(--surface);border-top:1px solid var(--ink-200);
      display:flex;flex-direction:column;gap:8px">
      <button class="btn btn--p" style="width:100%;min-height:48px"
        onclick="toast('Rahmat!','Izohingiz ShifoTop sahifasida chiqdi')">Izohni yuborish</button>
      <button class="btn--g" style="width:100%;padding:10px;font-size:13px">Hozir emas</button>
    </div>
  </div>`;
}

/* ---------- ROUTER ---------- */
const SCREENS = {
  flow:  {t:'Oqim xaritasi', w:1440, r:()=>scFlow()},
  s00:   {t:'S-00 · Kirish', w:1440, r:()=>scLogin()},
  s10:   {t:'S-10 · Navbat boshqaruvi', w:1440, r:()=>{S.tab='navbat';return scQueue()}},
  s11a:  {t:'S-11a · Yangi navbat — 1-qadam', w:1440, pre:()=>{S.overlay='newticket';S.step=1}, r:()=>scQueue()},
  s11b:  {t:'S-11b · Yangi navbat — 2-qadam', w:1440, pre:()=>{S.overlay='newticket';S.step=2}, r:()=>scQueue()},
  s12:   {t:'S-12 · Navbat kartochkasi', w:1440, pre:()=>{S.overlay='ticket'}, r:()=>scQueue()},
  s10c:  {t:'S-10c · Foydalanuvchi menyusi', w:1440, pre:()=>{S.overlay='menu'}, r:()=>scQueue()},
  s13:   {t:'S-13 · Bemorlar bazasi', w:1440, r:()=>scPatients()},
  s14:   {t:'S-14 · Bemor kartasi', w:1440, r:()=>scPatientCard()},
  s15:   {t:"S-15 · Qayta aloqa qo'ng'iroqlari", w:1440, r:()=>scCalls('follow')},
  s16:   {t:"S-16 · Qo'ng'iroq natijasi", w:1440, pre:()=>{S.overlay='outcome'}, r:()=>scCalls('follow')},
  s17:   {t:"S-17 · Qayta ko'rik tasdiqlash", w:1440, r:()=>scCalls('confirm')},
  s17b:  {t:"S-17b · Tasdiqlash qo'ng'irog'i + vaqt tanlash", w:1440,
          pre:()=>{S.overlay='confcall'}, r:()=>scCalls('confirm')},
  s20:   {t:'S-20 · Shifokor — mening navbatim', w:1440, r:()=>scDoctor(false)},
  s20b:  {t:'S-20b · Qayta chaqirish (2/2)', w:1440, r:()=>scDoctor(true)},
  s21:   {t:'S-21 · Qabul yozuvi — xizmat, narx, qayta ko\'rik', w:1440, r:()=>scVisit()},
  s30:   {t:'S-30 · Kassa — hisoblar', w:1440, r:()=>scCashier()},
  s31:   {t:"S-31 · To'lovni qabul qilish", w:1440, pre:()=>{S.overlay='pay'}, r:()=>scCashier()},
  s32:   {t:'S-32 · Smenani yopish', w:1440, r:()=>scShift()},
  s43:   {t:'S-43 · Mening profilim', w:1440, r:()=>scProfile()},
  s40:   {t:'S-40 · Dashboard (rahbar)', w:1440, r:()=>scDash()},
  s41:   {t:'S-41 · Shifokorlar samaradorligi', w:1440, r:()=>scDocStats()},
  s44:   {t:'S-44 · Xizmatlar tahlili', w:1440, r:()=>scServices()},
  s47:   {t:'S-47 · Shifokorlar jadvali', w:1440, r:()=>scSchedule()},
  s45:   {t:'S-45 · Klinika sozlamalari', w:1440, r:()=>scSettings()},
  s43b:  {t:'S-43b · Xodimlar va rollar', w:1440, r:()=>scStaff()},
  s44b:  {t:'S-44b · Xizmatlar va narxlar', w:1440, r:()=>scPriceList()},
  s46:   {t:'S-46 · Amallar jurnali', w:1440, r:()=>scAudit()},
  s18:   {t:'S-18 · Kunni yopish', w:1440, r:()=>scDayClose()},
  s70:   {t:'S-70 · Bemor · navbat holati', w:390, mob:1, r:()=>scPatientQueue()},
  s71:   {t:'S-71 · Bemor · izoh qoldirish', w:390, mob:1, r:()=>scReview()},
  s50:   {t:'S-50 · TV navbat ekrani', w:1920, tv:1, r:()=>scTV(false)},
  s50b:  {t:"S-50b · TV — navbat bo'sh", w:1920, tv:1, r:()=>scTV(true)},
  s51:   {t:'S-51 · TV ekranni ulash', w:1920, tv:1, r:()=>scPairing()},
  'st-load':{t:'Holat · Yuklanmoqda', w:1440, pre:()=>{S.variant='loading'}, r:()=>scQueue()},
  'st-off': {t:'Holat · Aloqa uzildi', w:1440, pre:()=>{S.variant='offline';S.conn='off'}, r:()=>scQueue()},
  'st-403': {t:'S-02 · Ruxsat yo\'q', w:1440, r:()=>scState('403')},
  'st-err': {t:'S-02 · Xatolik', w:1440, r:()=>scState('err')},
};

function go(id){
  S.screen = id; S.overlay=null; S.variant='default'; S.toast=null; S.step=1;
  if(S.conn==='off' && id!=='st-off') S.conn='live';
  const sc = SCREENS[id];
  if(sc && sc.pre) sc.pre();
  render();
}
function openDrawer(){ S.overlay='newticket'; S.step=1; render(); }
function toggleMenu(){ S.overlay = S.overlay==='menu' ? null : 'menu'; render(); }
function closeOverlay(){ S.overlay=null; render(); }
let toastTimer;
function toast(t,d){
  S.toast=[t,d]; render();
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{S.toast=null;render()},3200);
}

/* Statebar (holat variantlari) */
const VARIANTS = [
  ['default','Oddiy'], ['loading','Yuklanmoqda'], ['empty','Bo\'sh'], ['offline','Aloqa yo\'q'],
];
function renderStatebar(){
  const sc = SCREENS[S.screen];
  const show = ['s10','s13'].includes(S.screen);
  const bar = document.getElementById('statebar');
  if(!show){ bar.style.display='none'; return; }
  bar.style.display='flex';
  bar.innerHTML = VARIANTS.map(([v,l])=>
    `<button class="${S.variant===v?'is-active':''}" onclick="setVariant('${v}')">${l}</button>`).join('');
}
function setVariant(v){
  S.variant=v;
  S.conn = v==='offline' ? 'off' : 'live';
  render();
}

/* Navigator */
function renderNav(){
  document.getElementById('navList').innerHTML = NAV.map(g=>
    `<div class="nav__group"><div class="nav__gtitle">${g.g}</div>
      ${g.items.map(it=>`<button class="nav__item ${S.screen===it.id?'is-active':''}" onclick="go('${it.id}')">
        <span class="nav__id">${it.ref}</span><span class="nav__label">${it.label}</span></button>`).join('')}
    </div>`).join('');
}

/* Sahna */
function render(){
  const sc = SCREENS[S.screen] || SCREENS.flow;
  const frame = document.getElementById('frame');
  frame.className = 'frame' + (sc.tv?' frame--tv':'');
  frame.innerHTML = sc.r();
  document.getElementById('caption').innerHTML =
    `<span>${sc.t}</span><span class="mono">${sc.w}×${sc.tv?1080:sc.mob?844:(S.screen==='flow'?'auto':900)}</span>`;
  fit();
  renderNav();
  renderStatebar();
}
function fit(){
  const stage=document.getElementById('stage');
  const sc = SCREENS[S.screen] || SCREENS.flow;
  const avail = stage.clientWidth - 56;
  const scale = Math.min(1, avail / sc.w);
  const frame=document.getElementById('frame');
  frame.style.width = sc.w+'px';
  frame.style.transform = 'none';
  const h = sc.tv ? 1080 : sc.mob ? 844 : (S.screen==='flow' ? frame.offsetHeight : 900);
  frame.style.transform = `scale(${scale})`;
  const inner = document.querySelector('.stage__inner');
  inner.style.width = (sc.w*scale)+'px';
  inner.style.height = (h*scale)+'px';
}
window.addEventListener('resize', fit);
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeOverlay();
  if(e.key==='F2'){ e.preventDefault(); openDrawer(); }
});
render();
</script>
